name: Build

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Compile LaTeX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile main.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: false
          latexmk_shell_escape: true
          args: -pdf -halt-on-error -output-directory=release/target

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: main
          path: release/target/main.pdf
          retention-days: 30
